name: PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Check launcher syntax
        run: sh -n startapp.sh
      - name: Validate Openbox XML
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('rc.xml.template')"
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: praat-headless:test
      - name: Check Praat version
        run: docker run --rm --entrypoint /usr/local/bin/praat praat-headless:test --version
      - name: Check desktop startup
        shell: bash
        run: |
          set -euo pipefail

          docker run -d --name praat-smoke \
            -p 127.0.0.1:5800:5800 \
            praat-headless:test

          trap 'docker logs praat-smoke || true; docker rm -f praat-smoke >/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:5800/ >/dev/null 2>&1 &&
              docker top praat-smoke -eo pid,comm | grep -Eq '[[:space:]]praat$'; then
              echo "Praat desktop and web interface are ready."
              exit 0
            fi

            sleep 1
          done

          echo "ERROR: Praat desktop did not become ready within 60 seconds." >&2
          exit 1
